[package]
name = "bulx"
version = "0.0.1"
edition = "2024"
description = "A runtime platform that makes executing unknown software safe by default"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bulx-dev/bulx"
keywords = ["security", "runtime", "sandbox", "cli", "devtools"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[[bin]]
name = "bulx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
nix = { version = "0.29", features = ["process", "signal", "term", "fs", "ptrace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.5"
enumflags2 = "0.7"
seccompiler = "0.4"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

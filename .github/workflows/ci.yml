name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
      - name: Run Benchmarks
        if: matrix.os == 'ubuntu-latest'
        run: bash tests/benchmark.sh
      - name: Run Security Escapes
        if: matrix.os == 'ubuntu-latest'
        run: bash tests/security_escapes.sh
